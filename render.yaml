services:
  - type: web
    runtime: static
    name: higiatrade-client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_API_URL
        value: https://higiatrade-server.onrender.com/api
      - key: NEXT_PUBLIC_SITE_URL
        value: https://higiatrade.com
      - key: SEO_STRICT
        value: "1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
