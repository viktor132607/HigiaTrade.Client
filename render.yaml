services:
  - type: web
    runtime: static
    name: higiatrade-client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_API_URL
        value: https://higiatrade-server.onrender.com/api
      - key: NEXT_PUBLIC_SITE_URL
        value: https://higiatrade.com
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_BING_SITE_VERIFICATION
        sync: false
      - key: SEO_MIN_REGIONAL_CATEGORY_PRODUCTS
        value: "4"
      - key: SEO_MAX_REGIONAL_CATEGORIES
        value: "6"
      - key: SEO_STRICT
        value: "1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html