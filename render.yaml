services:
  - type: web
    runtime: static
    name: higiatrade-client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_API_URL
        value: https://higiatrade-server.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
