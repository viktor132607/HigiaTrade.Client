name: One-shot product edit diagnostic

on:
  push:
    paths:
      - '.github/workflows/one-shot-diagnose-product-edit.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live category state
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base = 'https://higiatrade-server.onrender.com/api'
          with urllib.request.urlopen(base + '/Categories', timeout=60) as r:
              categories = json.loads(r.read().decode('utf-8'))
          for c in categories:
              name = str(c.get('name') or '')
              if 'професион' in name.lower() or 'почиств' in name.lower():
                  print('CATEGORY', json.dumps(c, ensure_ascii=False, sort_keys=True))
          PY
