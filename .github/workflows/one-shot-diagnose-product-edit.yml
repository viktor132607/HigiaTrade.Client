name: One-shot product edit diagnostic

on:
  push:
    paths:
      - '.github/workflows/one-shot-diagnose-product-edit.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live product/category state
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          base = 'https://higiatrade-server.onrender.com/api'
          search = 'Sano Professionals'

          def get(path):
              with urllib.request.urlopen(base + path, timeout=60) as r:
                  return r.status, json.loads(r.read().decode('utf-8'))

          status, products_payload = get('/Products?' + urllib.parse.urlencode({
              'Title': search,
              'PageNumber': 1,
              'PageSize': 100,
              'SortBy': 'title',
              'SortDescending': 'false',
          }))
          print('PRODUCTS_STATUS', status)
          items = products_payload.get('items', []) if isinstance(products_payload, dict) else products_payload
          print('MATCH_COUNT', len(items))

          cstatus, categories = get('/Categories')
          print('CATEGORIES_STATUS', cstatus)
          print('CATEGORY_COUNT', len(categories) if isinstance(categories, list) else 'not-list')

          for p in items:
              title = str(p.get('title',''))
              if '255' not in title.lower() and 'fresh' not in title.lower():
                  continue
              cid = str(p.get('categoryId') or '')
              match = next((c for c in categories if str(c.get('id') or '') == cid), None) if isinstance(categories, list) else None
              print('--- CANDIDATE ---')
              print('PRODUCT_JSON', json.dumps(p, ensure_ascii=False, sort_keys=True))
              print('PRODUCT_CATEGORY_ID', cid)
              print('PRODUCT_CATEGORY_NAME', p.get('categoryName'))
              print('ACTIVE_CATEGORY_MATCH', json.dumps(match, ensure_ascii=False, sort_keys=True))
              print('CATEGORY_IS_ACTIVE', bool(match))
              print('DISCOUNT_PERCENTAGE', p.get('discountPercentage'))
              print('DISCOUNTED_PRICE', p.get('discountedPrice'))
              print('REGULAR_PRICE', p.get('regularPrice'))
              print('WHOLESALE_PRICE', p.get('wholesalePriceInclVat', p.get('wholesalePrice')))
              print('WHOLESALE_MIN_QUANTITY', p.get('wholesaleMinQuantity'))
              print('VAT_RATE', p.get('vatRate'))
              print('MAIN_IMAGE_URL', p.get('mainImageUrl'))
              print('SECONDARY_IMAGES_COUNT', len(p.get('secondaryImages') or []))
          PY
