name: One-time product form upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-product-form-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin product form
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/admin/Products.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f"Patch anchor not found:\n{old[:200]}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { formatCurrency } from "../../utils/currency";\n',
              'import { formatCurrency } from "../../utils/currency";\nimport ProductPricingAndUploadFields from "../../components/admin/ProductPricingAndUploadFields";\n'
          )

          replace_once(
              '  discountedPrice: number;\n  reviews: Array<{',
              '  discountedPrice: number;\n  wholesalePrice?: number;\n  wholesalePriceInclVat?: number;\n  vatRate?: number;\n  reviews: Array<{'
          )

          replace_once(
              '  const handleSubmit = async (e: React.FormEvent) => {\n    e.preventDefault();\n\n    if (!validateForm()) {\n      return;\n    }\n\n    try {\n      const isEditing = !!editingProduct;\n\n      const submitData = {',
              '''  const handleSubmit = async (e: React.FormEvent<HTMLFormElement>) => {\n    e.preventDefault();\n\n    if (!validateForm()) {\n      return;\n    }\n\n    const submittedFields = new window.FormData(e.currentTarget);\n    const retailPriceRaw = String(submittedFields.get("retailPrice") ?? "").trim();\n    const wholesalePriceRaw = String(submittedFields.get("wholesalePrice") ?? "").trim();\n    const vatRateRaw = String(submittedFields.get("vatRate") ?? "20").trim();\n\n    const retailPrice =\n      retailPriceRaw === ""\n        ? parseFloat(formData.regularPrice) || 0\n        : Math.max(0, parseFloat(retailPriceRaw) || 0);\n    const wholesalePrice =\n      wholesalePriceRaw === ""\n        ? 0\n        : Math.max(0, parseFloat(wholesalePriceRaw) || 0);\n    const vatRate = Math.min(100, Math.max(0, parseFloat(vatRateRaw) || 20));\n\n    try {\n      const isEditing = !!editingProduct;\n\n      const submitData = {'''
          )

          replace_once(
              '        regularPrice: parseFloat(formData.regularPrice) || 0,\n        discountPercentage:',
              '        regularPrice: retailPrice,\n        wholesalePrice,\n        wholesaleMinQuantity: wholesalePrice > 0 ? 2 : 0,\n        vatRate,\n        discountPercentage:'
          )

          anchor = '''                  {validationErrors.secondaryImages?.some((error) => error) && (\n                    <p className="mt-1 text-sm text-red-600">\n                      Enter valid image URLs.\n                    </p>\n                  )}\n                </div>\n              </div>\n'''

          replacement = '''                  {validationErrors.secondaryImages?.some((error) => error) && (\n                    <p className="mt-1 text-sm text-red-600">\n                      Enter valid image URLs.\n                    </p>\n                  )}\n                </div>\n\n                <ProductPricingAndUploadFields\n                  key={editingProduct?.id ?? "new-product"}\n                  token={token}\n                  regularPrice={formData.regularPrice}\n                  defaultRetailPrice={editingProduct?.regularPrice}\n                  defaultWholesalePrice={\n                    editingProduct?.wholesalePriceInclVat ??\n                    editingProduct?.wholesalePrice\n                  }\n                  onImageUploaded={(url) => {\n                    setFormData((previous) => ({\n                      ...previous,\n                      mainImageUrl: url,\n                    }));\n                    setValidationErrors((previous) => ({\n                      ...previous,\n                      mainImageUrl: undefined,\n                    }));\n                  }}\n                />\n              </div>\n'''
          replace_once(anchor, replacement)

          path.write_text(text, encoding="utf-8")

      - name: Commit patched form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/Products.tsx
          git commit -m "Integrate retail wholesale VAT and image upload fields"
          git push
