name: One-shot force real product images

"on":
  push:
    paths:
      - '.github/workflows/one-shot-force-real-product-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch product image handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          upload_path = Path('src/components/admin/ProductPricingAndUploadFields.tsx')
          upload = upload_path.read_text(encoding='utf-8')

          old_prop = '''  currentMainImageUrl?: string;\n  currentSecondaryImages?: ProductImage[];\n  onImagesChange: (\n'''
          new_prop = '''  currentMainImageUrl?: string;\n  currentSecondaryImages?: ProductImage[];\n  usesDefaultImage?: boolean;\n  onImagesChange: (\n'''
          if old_prop not in upload:
              raise SystemExit('props anchor missing')
          upload = upload.replace(old_prop, new_prop, 1)

          old_destructure = '''  currentMainImageUrl,\n  currentSecondaryImages = [],\n  onImagesChange,\n}: Props) => {\n  const initialMainImageUrl = currentMainImageUrl?.trim() ?? "";\n'''
          new_destructure = '''  currentMainImageUrl,\n  currentSecondaryImages = [],\n  usesDefaultImage = false,\n  onImagesChange,\n}: Props) => {\n  const initialMainImageUrl = usesDefaultImage ? "" : currentMainImageUrl?.trim() ?? "";\n'''
          if old_destructure not in upload:
              raise SystemExit('destructure anchor missing')
          upload = upload.replace(old_destructure, new_destructure, 1)

          old_upload = '''      const nextImages = [...uploadedImages, ...uploaded];\n      notifyImagesChange(nextImages);\n\n      if (\n'''
          new_upload = '''      const nextImages = [...uploadedImages, ...uploaded];\n      const firstRealUpload = uploadedImages.length === 0 ? uploaded[0]?.uri ?? "" : mainImageUri;\n      notifyImagesChange(nextImages, firstRealUpload);\n\n      if (\n'''
          if old_upload not in upload:
              raise SystemExit('upload anchor missing')
          upload = upload.replace(old_upload, new_upload, 1)

          upload_path.write_text(upload, encoding='utf-8')

          products_path = Path('src/components/admin/AdminProductsLegacy.tsx')
          products = products_path.read_text(encoding='utf-8')
          old_call = '''                  currentMainImageUrl={formData.mainImageUrl}\n                  currentSecondaryImages={formData.secondaryImages}\n                  onImagesChange={(mainImageUrl, secondaryImages) => {\n'''
          new_call = '''                  currentMainImageUrl={formData.mainImageUrl}\n                  currentSecondaryImages={formData.secondaryImages}\n                  usesDefaultImage={editingProduct?.usesDefaultImage === true}\n                  onImagesChange={(mainImageUrl, secondaryImages) => {\n'''
          if old_call not in products:
              raise SystemExit('component call anchor missing')
          products = products.replace(old_call, new_call, 1)
          products_path.write_text(products, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit source changes
        shell: bash
        run: |
          git checkout -- package-lock.json package.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-force-real-product-images.yml
          git add src/components/admin/ProductPricingAndUploadFields.tsx src/components/admin/AdminProductsLegacy.tsx
          git commit -m "Keep fallback logos out of product image gallery"
          git push
