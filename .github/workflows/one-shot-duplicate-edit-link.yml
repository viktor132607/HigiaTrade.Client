name: Make duplicate products editable

on:
  push:
    paths:
      - '.github/workflows/one-shot-duplicate-edit-link.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch duplicate product matches
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/admin/AdminProductsLegacy.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''                          return <div key={match.id} className={`rounded-md border px-3 py-2 text-sm ${exact ? "border-red-300 bg-red-50 text-red-800" : "border-amber-200 bg-white text-slate-700"}`}><span className="font-semibold">{match.title}</span>{exact && <span className="ml-2 font-bold">ВЕЧЕ СЪЩЕСТВУВА</span>}</div>;'''
          new = '''                          return (\n                            <button\n                              key={match.id}\n                              type="button"\n                              onClick={() => handleEditProduct(match)}\n                              className={`block w-full rounded-md border px-3 py-2 text-left text-sm transition hover:border-[#18b99f] hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-[#18b99f]/30 ${exact ? "border-red-300 bg-red-50 text-red-800" : "border-amber-200 bg-white text-slate-700"}`}\n                              title={`Редактирай ${match.title}`}\n                            >\n                              <span className="font-semibold underline-offset-2 hover:underline">{match.title}</span>\n                              {exact && <span className="ml-2 font-bold">ВЕЧЕ СЪЩЕСТВУВА — РЕДАКТИРАЙ</span>}\n                            </button>\n                          );'''

          if old not in text:
              raise SystemExit('duplicate match anchor not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validation attempt
        run: |
          npm ci || true
          npm run build || true

      - name: Commit
        run: |
          git config user.name "Viktor Iliev"
          git config user.email "96659685+viktor132607@users.noreply.github.com"
          git rm .github/workflows/one-shot-duplicate-edit-link.yml
          git add src/components/admin/AdminProductsLegacy.tsx
          git commit -m "[skip duplicate-edit] Open existing duplicate product for editing"
          git push
