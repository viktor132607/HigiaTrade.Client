name: One-shot invoice category selection

on:
  push:
    paths:
      - '.github/workflows/one-shot-invoice-category-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Add category and subcategory selection to invoice import
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/admin/InvoiceImport.tsx')
          text = p.read_text(encoding='utf-8')

          def repl(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing anchor: {label}')
              text = text.replace(old, new, 1)

          repl(
              'type CategoryOption = { id: string; name: string };',
              'type CategoryOption = { id: string; name: string; parentCategoryId: string | null; parentCategoryName: string | null };',
              'category type'
          )
          repl(
              'type EditableItem = ExtractedItem & { selectedProductId: string; editableProductName: string; editableQuantity: string };',
              'type EditableItem = ExtractedItem & { selectedProductId: string; editableProductName: string; editableQuantity: string; selectedCategoryId: string; selectedSubcategoryId: string };',
              'editable item type'
          )

          collect_named_end = '''const collectNamed = (value: unknown): CatalogProduct[] => {
            if (Array.isArray(value)) return value.flatMap((item) => {
              if (!item || typeof item !== "object") return [];
              const o = item as Record<string, unknown>;
              const id = String(o.id ?? o.Id ?? "");
              const name = String(o.title ?? o.Title ?? o.name ?? o.Name ?? "").trim();
              return id && name ? [{ id, name }] : [];
            });
            if (!value || typeof value !== "object") return [];
            const o = value as Record<string, unknown>;
            for (const key of ["items", "Items", "products", "Products", "categories", "Categories", "data", "Data", "result", "Result"]) {
              const found = collectNamed(o[key]);
              if (found.length) return found;
            }
            return [];
          };
          '''
          collect_categories = collect_named_end + '''
          const collectCategories = (value: unknown): CategoryOption[] => {
            const source = Array.isArray(value)
              ? value
              : value && typeof value === "object"
                ? ((value as Record<string, unknown>).items ?? (value as Record<string, unknown>).Items ?? (value as Record<string, unknown>).categories ?? (value as Record<string, unknown>).Categories ?? [])
                : [];
            if (!Array.isArray(source)) return [];
            return source.flatMap((item) => {
              if (!item || typeof item !== "object") return [];
              const o = item as Record<string, unknown>;
              const id = String(o.id ?? o.Id ?? "");
              const name = String(o.name ?? o.Name ?? "").trim();
              if (!id || !name) return [];
              const parentIdRaw = o.parentCategoryId ?? o.ParentCategoryId ?? null;
              const parentNameRaw = o.parentCategoryName ?? o.ParentCategoryName ?? null;
              return [{
                id,
                name,
                parentCategoryId: parentIdRaw ? String(parentIdRaw) : null,
                parentCategoryName: parentNameRaw ? String(parentNameRaw) : null,
              }];
            });
          };
          '''
          repl(collect_named_end, collect_categories, 'collectCategories helper')

          repl(
              'const validRowsWithIndexes = useMemo(() => rows.map((row, index) => ({ row, index })).filter(({ row }) => Boolean(row.selectedProductId || row.editableProductName.trim()) && Number.isInteger(Number(row.editableQuantity)) && Number(row.editableQuantity) > 0), [rows]);',
              'const validRowsWithIndexes = useMemo(() => rows.map((row, index) => ({ row, index })).filter(({ row }) => Boolean(row.selectedProductId || (row.editableProductName.trim() && row.selectedCategoryId)) && Number.isInteger(Number(row.editableQuantity)) && Number(row.editableQuantity) > 0), [rows]);',
              'valid rows'
          )
          repl(
              'const allConfirmed = rows.length > 0 && rows.every((row, index) => Boolean(row.selectedProductId || row.editableProductName.trim()) && Number.isInteger(Number(row.editableQuantity)) && Number(row.editableQuantity) > 0 && confirmedQuantities.has(index));',
              'const allConfirmed = rows.length > 0 && rows.every((row, index) => Boolean(row.selectedProductId || (row.editableProductName.trim() && row.selectedCategoryId)) && Number.isInteger(Number(row.editableQuantity)) && Number(row.editableQuantity) > 0 && confirmedQuantities.has(index));',
              'all confirmed'
          )
          repl(
              'const authHeaders = token ? { Authorization: `Bearer ${token}` } : undefined;',
              '''const authHeaders = token ? { Authorization: `Bearer ${token}` } : undefined;
          const mainCategories = useMemo(
            () => categories.filter((category) => !category.parentCategoryId).sort((a, b) => a.name.localeCompare(b.name, "bg-BG", { sensitivity: "base" })),
            [categories]
          );''',
              'main categories memo'
          )

          repl(
              'setCategories(collectNamed(payload));',
              'setCategories(collectCategories(payload).sort((a, b) => a.name.localeCompare(b.name, "bg-BG", { sensitivity: "base" })));',
              'load category metadata'
          )

          repl(
              'setRows(cleanItems.map((item) => ({ ...item, selectedProductId: item.matchedProductId ?? "", editableProductName: item.matchedProductName ?? item.rawName, editableQuantity: String(item.quantity || "") })));',
              'setRows(cleanItems.map((item) => ({ ...item, selectedProductId: item.matchedProductId ?? "", editableProductName: item.matchedProductName ?? item.rawName, editableQuantity: String(item.quantity || ""), selectedCategoryId: "", selectedSubcategoryId: "" })));',
              'initialize category selection'
          )

          repl(
              'const createPlaceholderProduct = async (title: string): Promise<string> => {',
              'const createPlaceholderProduct = async (title: string, categoryId: string): Promise<string> => {',
              'placeholder signature'
          )
          repl(
              '''    const categoryId = categories[0]?.id;
              if (!categoryId) throw new Error(isBg ? "Няма налична категория за автоматично добавяне на нов продукт." : "No category is available for automatic product creation.");''',
              '''    if (!categoryId) throw new Error(isBg ? "Избери категория за новия продукт." : "Choose a category for the new product.");''',
              'remove first category fallback'
          )

          repl(
              'const created = await Promise.all(missing.map(async ({ row, index }) => ({ index, id: await createPlaceholderProduct(row.editableProductName) })));',
              'const created = await Promise.all(missing.map(async ({ row, index }) => ({ index, id: await createPlaceholderProduct(row.editableProductName, row.selectedSubcategoryId || row.selectedCategoryId) })));',
              'create using selected category'
          )

          old_select = '''<select value={row.selectedProductId} onChange={(e) => { const id=e.target.value; const p=catalog.find((x)=>x.id===id); setRows((current)=>current.map((item,i)=>i===index?{...item,selectedProductId:id,editableProductName:p?.name ?? item.editableProductName}:item)); }} className="min-h-10 w-full rounded-lg border border-slate-300 bg-white px-3 font-semibold"><option value="">— {isBg ? "Няма в каталога — ще се добави автоматично" : "Not in catalog — will be added automatically"} —</option>{catalog.map((p)=><option key={p.id} value={p.id}>{p.name}</option>)}</select><input value={row.editableProductName} onChange={(e)=>{const value=e.target.value;setRows((current)=>current.map((item,i)=>i===index?{...item,editableProductName:value,selectedProductId:""}:item));}} className="mt-2 min-h-10 w-full rounded-lg border border-slate-300 px-3 font-semibold" placeholder={isBg?"Име на продукта":"Product name"}/>{missing && <div className="mt-1 text-xs font-bold text-amber-700">{isBg ? "Ще се създаде автоматично като неактивен продукт за допълване." : "Will be auto-created as an inactive product to complete later."}</div>}'''
          new_select = '''<select value={row.selectedProductId} onChange={(e) => { const id=e.target.value; const p=catalog.find((x)=>x.id===id); setRows((current)=>current.map((item,i)=>i===index?{...item,selectedProductId:id,editableProductName:p?.name ?? item.editableProductName,selectedCategoryId:id?"":item.selectedCategoryId,selectedSubcategoryId:id?"":item.selectedSubcategoryId}:item)); }} className="min-h-10 w-full rounded-lg border border-slate-300 bg-white px-3 font-semibold"><option value="">— {isBg ? "Няма в каталога — ще се добави автоматично" : "Not in catalog — will be added automatically"} —</option>{catalog.map((p)=><option key={p.id} value={p.id}>{p.name}</option>)}</select><input value={row.editableProductName} onChange={(e)=>{const value=e.target.value;setRows((current)=>current.map((item,i)=>i===index?{...item,editableProductName:value,selectedProductId:""}:item));}} className="mt-2 min-h-10 w-full rounded-lg border border-slate-300 px-3 font-semibold" placeholder={isBg?"Име на продукта":"Product name"}/>{missing && <div className="mt-2 grid gap-2 sm:grid-cols-2"><label className="text-xs font-bold text-slate-600"><span className="mb-1 block">{isBg ? "Категория *" : "Category *"}</span><select value={row.selectedCategoryId} onChange={(e)=>{const value=e.target.value;setRows((current)=>current.map((item,i)=>i===index?{...item,selectedCategoryId:value,selectedSubcategoryId:""}:item));}} className={`min-h-10 w-full rounded-lg border bg-white px-3 text-sm font-semibold ${row.selectedCategoryId?"border-slate-300":"border-amber-400"}`}><option value="">— {isBg ? "Избери категория" : "Choose category"} —</option>{mainCategories.map((category)=><option key={category.id} value={category.id}>{category.name}</option>)}</select></label><label className="text-xs font-bold text-slate-600"><span className="mb-1 block">{isBg ? "Подкатегория" : "Subcategory"}</span><select value={row.selectedSubcategoryId} disabled={!row.selectedCategoryId} onChange={(e)=>{const value=e.target.value;setRows((current)=>current.map((item,i)=>i===index?{...item,selectedSubcategoryId:value}:item));}} className="min-h-10 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm font-semibold disabled:bg-slate-100 disabled:text-slate-400"><option value="">— {isBg ? "Без подкатегория" : "No subcategory"} —</option>{categories.filter((category)=>category.parentCategoryId===row.selectedCategoryId).map((category)=><option key={category.id} value={category.id}>{category.name}</option>)}</select></label></div>}{missing && <div className="mt-1 text-xs font-bold text-amber-700">{row.selectedCategoryId ? (isBg ? "Ще се създаде автоматично като неактивен продукт за допълване." : "Will be auto-created as an inactive product to complete later.") : (isBg ? "Избери категория, за да може новият продукт да бъде създаден." : "Choose a category so the new product can be created.")}</div>}'''
          repl(old_select, new_select, 'row category controls')

          p.write_text(text, encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Commit source change
        run: |
          git checkout -- package-lock.json package.json 2>/dev/null || true
          git config user.name "Viktor Iliev"
          git config user.email "96659685+viktor132607@users.noreply.github.com"
          git add src/pages/admin/InvoiceImport.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add category selection to invoice import"
          git push
