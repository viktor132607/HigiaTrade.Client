name: One-time image drag and VAT upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch product image field integration
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/admin/Products.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''                <ProductPricingAndUploadFields
                  key={editingProduct?.id ?? "new-product"}
                  token={token}
                  regularPrice={formData.regularPrice}
                  defaultRetailPrice={editingProduct?.regularPrice}
                  defaultWholesalePrice={
                    editingProduct?.wholesalePriceInclVat ??
                    editingProduct?.wholesalePrice
                  }
                  onImageUploaded={(url) => {
                    setFormData((previous) => ({
                      ...previous,
                      mainImageUrl: url,
                    }));
                    setValidationErrors((previous) => ({
                      ...previous,
                      mainImageUrl: undefined,
                    }));
                  }}
                />'''

          new = '''                <ProductPricingAndUploadFields
                  key={editingProduct?.id ?? "new-product"}
                  token={token}
                  regularPrice={formData.regularPrice}
                  defaultRetailPrice={editingProduct?.regularPrice}
                  defaultWholesalePrice={
                    editingProduct?.wholesalePriceInclVat ??
                    editingProduct?.wholesalePrice
                  }
                  currentMainImageUrl={formData.mainImageUrl}
                  currentSecondaryImages={formData.secondaryImages}
                  onImagesChange={(mainImageUrl, secondaryImages) => {
                    setFormData((previous) => ({
                      ...previous,
                      mainImageUrl,
                      secondaryImages,
                    }));
                    setValidationErrors((previous) => ({
                      ...previous,
                      mainImageUrl: undefined,
                      secondaryImages: undefined,
                    }));
                  }}
                />'''

          if old not in text:
              raise SystemExit("ProductPricingAndUploadFields integration block not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit patched product form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/Products.tsx
          git commit -m "Integrate draggable product image ordering"
          git push
