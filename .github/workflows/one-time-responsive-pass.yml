name: One-time responsive pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-responsive-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive pass
        shell: python
        run: |
          from pathlib import Path

          def replace(path_str, old, new, count=0):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path_str}: {old[:160]}")
              text = text.replace(old, new, count if count else -1)
              path.write_text(text, encoding="utf-8")

          # Global responsive container and iPhone input behavior.
          css = Path("src/index.css")
          css_text = css.read_text(encoding="utf-8")
          marker = "/* Responsive foundation: iPhone, iPad, laptop, wide desktop */"
          if marker not in css_text:
              css_text += r'''

/* Responsive foundation: iPhone, iPad, laptop, wide desktop */
.site-container {
  width: 100%;
  margin-inline: auto;
  padding-left: max(1rem, env(safe-area-inset-left));
  padding-right: max(1rem, env(safe-area-inset-right));
}

@media (min-width: 640px) {
  .site-container {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

@media (min-width: 1024px) {
  .site-container {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}

@media (min-width: 1280px) {
  .site-container {
    max-width: 1440px;
  }
}

@media (min-width: 1536px) {
  .site-container {
    max-width: 1680px;
  }
}

@media (min-width: 2200px) {
  .site-container {
    max-width: 1920px;
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }
}

@media (max-width: 767px) {
  input,
  select,
  textarea {
    font-size: 16px;
  }
}
'''
              css.write_text(css_text, encoding="utf-8")

          # Navbar: iPhone/iPad stay compact; full desktop nav begins at laptop widths.
          replace(
              "src/components/layout/Navbar.tsx",
              'className="mx-auto flex max-w-7xl items-center gap-4 px-4 py-4 sm:px-6 lg:px-8"',
              'className="site-container flex items-center gap-2 py-2.5 sm:gap-4 sm:py-3 xl:py-4"',
              1,
          )
          replace("src/components/layout/Navbar.tsx", "md:hidden", "xl:hidden")
          replace(
              "src/components/layout/Navbar.tsx",
              'className="h-14 w-auto object-contain"',
              'className="h-10 w-auto max-w-[150px] object-contain sm:h-12 sm:max-w-[180px] xl:h-14 xl:max-w-none"',
              1,
          )
          replace(
              "src/components/layout/Navbar.tsx",
              'className="hidden flex-1 md:block"',
              'className="hidden min-w-0 flex-1 xl:block"',
              1,
          )
          replace(
              "src/components/layout/Navbar.tsx",
              'className="hidden items-center gap-3 lg:flex"',
              'className="hidden items-center gap-3 2xl:flex"',
              1,
          )
          replace(
              "src/components/layout/Navbar.tsx",
              'className="ml-auto hidden items-center gap-2 md:flex"',
              'className="ml-auto hidden items-center gap-1.5 xl:flex 2xl:gap-2"',
              1,
          )

          navbar = Path("src/components/layout/Navbar.tsx")
          nav_text = navbar.read_text(encoding="utf-8")
          logo_anchor = '''          <Link to="/" className="flex shrink-0 items-center">\n            <img\n              src="/higiqlogo.png"\n              alt="HygiaTrade"\n              className="h-10 w-auto max-w-[150px] object-contain sm:h-12 sm:max-w-[180px] xl:h-14 xl:max-w-none"\n            />\n          </Link>'''
          mobile_actions = logo_anchor + '''\n\n          <div className="ml-auto flex items-center gap-2 xl:hidden">\n            <Link\n              to="/cart"\n              className="relative inline-flex h-11 w-11 items-center justify-center rounded-full border border-[#d6dde3] text-[#70808d] dark:border-white/20 dark:text-white"\n              title={t("nav.cart")}\n            >\n              <ShoppingBagIcon className="h-6 w-6" />\n              <span className="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-[#7b8187] px-1 text-xs font-bold text-white">\n                {cartCount}\n              </span>\n            </Link>\n          </div>'''
          if logo_anchor not in nav_text:
              raise SystemExit("Navbar logo anchor not found")
          nav_text = nav_text.replace(logo_anchor, mobile_actions, 1)
          nav_text = nav_text.replace(
              '      <div className="bg-[#263b4d] text-white dark:bg-black">',
              '      <div className="hidden bg-[#263b4d] text-white dark:bg-black xl:block">',
              1,
          )
          nav_text = nav_text.replace(
              'className="mx-auto flex max-w-7xl items-center px-4 sm:px-6 lg:px-8"',
              'className="site-container flex items-center"',
              1,
          )
          nav_text = nav_text.replace(
              'className="hidden min-w-0 flex-1 items-center md:flex"',
              'className="hidden min-w-0 flex-1 items-center xl:flex"',
              1,
          )
          nav_text = nav_text.replace(
              'className="border-t border-[#d6dde3] bg-white px-4 py-4 transition-colors dark:border-white/20 dark:bg-black sm:px-6 xl:hidden"',
              'className="max-h-[calc(100dvh-5rem)] overflow-y-auto border-t border-[#d6dde3] bg-white px-4 py-4 transition-colors dark:border-white/20 dark:bg-black sm:px-6 xl:hidden"',
              1,
          )
          nav_text = nav_text.replace(
              'border-r border-[#385066] px-5 text-sm font-semibold',
              'border-r border-[#385066] px-3 text-xs font-semibold 2xl:px-5 2xl:text-sm',
          )
          navbar.write_text(nav_text, encoding="utf-8")

          # Products storefront scales from phone to 2560-wide desktop.
          replace(
              "src/pages/Products.tsx",
              'className="min-h-[calc(100vh-4rem)] bg-slate-50 px-4 py-8 sm:px-6 sm:py-10 lg:px-8"',
              'className="min-h-[calc(100vh-4rem)] bg-slate-50 py-5 sm:py-8 lg:py-10"',
              1,
          )
          replace("src/pages/Products.tsx", 'className="mx-auto max-w-7xl"', 'className="site-container"', 1)
          replace(
              "src/pages/Products.tsx",
              'className="mb-8 rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_24px_80px_-60px_rgba(15,23,42,0.55)]"',
              'className="mb-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-[0_24px_80px_-60px_rgba(15,23,42,0.55)] sm:mb-8 sm:rounded-[2rem] sm:p-6"',
              1,
          )
          replace(
              "src/pages/Products.tsx",
              'className="mt-3 font-display text-3xl font-bold tracking-tight text-slate-950"',
              'className="mt-3 font-display text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl"',
              1,
          )
          replace(
              "src/pages/Products.tsx",
              'className="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4"',
              'className="grid grid-cols-1 gap-4 min-[480px]:grid-cols-2 sm:gap-6 lg:grid-cols-3 2xl:grid-cols-4 min-[2200px]:grid-cols-5"',
              1,
          )

          # Footer uses the same fluid content width.
          footer = Path("src/components/layout/Footer.tsx")
          footer_text = footer.read_text(encoding="utf-8")
          footer_text = footer_text.replace(
              'className="mx-auto grid max-w-7xl gap-8 px-4 py-10 sm:px-6 md:grid-cols-2 lg:grid-cols-4 lg:px-8"',
              'className="site-container grid gap-8 py-8 sm:py-10 md:grid-cols-2 lg:grid-cols-4"',
          )
          footer_text = footer_text.replace(
              'className="mx-auto grid max-w-7xl gap-8 px-4 py-10 text-sm sm:px-6 md:grid-cols-2 lg:grid-cols-4 lg:px-8"',
              'className="site-container grid gap-8 py-8 text-sm sm:py-10 md:grid-cols-2 lg:grid-cols-4"',
              1,
          )
          footer_text = footer_text.replace(
              'className="mx-auto flex max-w-7xl flex-col gap-3 px-4 py-4 text-xs sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8"',
              'className="site-container flex flex-col gap-3 py-4 text-xs sm:flex-row sm:items-center sm:justify-between"',
              1,
          )
          footer.write_text(footer_text, encoding="utf-8")

          # Admin product form: overlay above sticky nav and phone-friendly modal.
          admin = Path("src/pages/admin/Products.tsx")
          admin_text = admin.read_text(encoding="utf-8")
          admin_text = admin_text.replace('className="mx-auto max-w-7xl"', 'className="site-container"', 1)
          admin_text = admin_text.replace(
              'className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-2 sm:p-4"',
              'className="fixed inset-0 z-[60] flex items-start justify-center overflow-y-auto bg-black/50 p-0 sm:p-4 sm:pt-8"',
              1,
          )
          admin_text = admin_text.replace(
              'className="max-h-[90vh] w-full max-w-4xl overflow-y-auto rounded-lg bg-white p-3 sm:p-6"',
              'className="w-full max-w-4xl overflow-y-auto bg-white p-4 sm:max-h-[calc(100dvh-4rem)] sm:rounded-lg sm:p-6"',
              1,
          )
          admin.write_text(admin_text, encoding="utf-8")

          # Product upload/pricing block: single-column images on narrow iPhones.
          pricing = Path("src/components/admin/ProductPricingAndUploadFields.tsx")
          pricing_text = pricing.read_text(encoding="utf-8")
          pricing_text = pricing_text.replace(
              'className="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4"',
              'className="grid grid-cols-1 gap-3 min-[390px]:grid-cols-2 sm:grid-cols-3 lg:grid-cols-4"',
          )
          pricing.write_text(pricing_text, encoding="utf-8")

      - name: Commit responsive pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/components/layout/Navbar.tsx src/components/layout/Footer.tsx src/pages/Products.tsx src/pages/admin/Products.tsx src/components/admin/ProductPricingAndUploadFields.tsx
          git commit -m "Add responsive layouts for phone tablet laptop and wide desktop"
          git push
