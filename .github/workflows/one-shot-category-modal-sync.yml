name: One-shot category modal state sync

"on":
  push:
    paths:
      - '.github/workflows/one-shot-category-modal-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch category state sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/AdminProductsLegacy.tsx')
          text = path.read_text(encoding='utf-8')
          anchor = '  const fetchBrands = async () => {\n'
          replacement = '''  useEffect(() => {
            const handleExternalCategoryCreated = (event: Event) => {
              const detail = (event as CustomEvent<{ id?: string; name?: string }>).detail;
              const id = String(detail?.id ?? "").trim();
              const name = String(detail?.name ?? "").trim();
              if (!id || !name) return;

              const createdCategory: Category = { id, name };
              setCategories((current) => [
                ...current.filter(
                  (category) =>
                    category.id !== id &&
                    category.name.trim().toLocaleLowerCase("bg-BG") !== name.toLocaleLowerCase("bg-BG")
                ),
                createdCategory,
              ].sort((a, b) => a.name.localeCompare(b.name, "bg-BG", { sensitivity: "base" })));
              setCategorySearch(name);
              setFormData((previous) => ({ ...previous, categoryId: id }));
              setValidationErrors((previous) => ({ ...previous, categoryId: undefined }));
              setCategoryCreateError("");
              setIsCategoryMenuOpen(false);
            };

            window.addEventListener("admin-category-created", handleExternalCategoryCreated as EventListener);
            return () => window.removeEventListener("admin-category-created", handleExternalCategoryCreated as EventListener);
          }, []);

          const fetchBrands = async () => {
          '''
          if anchor not in text:
              raise SystemExit('fetchBrands anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit source changes
        shell: bash
        run: |
          git checkout -- package-lock.json package.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-category-modal-sync.yml
          git add src/components/admin/AdminProductsLegacy.tsx
          git commit -m "Select newly created category in product form"
          git push
