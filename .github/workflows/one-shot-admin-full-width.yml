name: One-shot full-width admin layout fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-admin-full-width.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply full-width admin fix
        shell: python
        run: |
          from pathlib import Path

          panel = Path('src/pages/admin/AdminPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          old = 'className="mx-auto min-h-[calc(100vh-4rem)] max-w-[1600px] lg:grid lg:grid-cols-[260px_minmax(0,1fr)]"'
          new = 'className="min-h-[calc(100vh-4rem)] w-full max-w-none lg:grid lg:grid-cols-[260px_minmax(0,1fr)]"'
          if old not in text:
              raise SystemExit('AdminPanel width limiter was not found')
          panel.write_text(text.replace(old, new, 1), encoding='utf-8')

          css = Path('src/responsive-audit.css')
          css_text = css.read_text(encoding='utf-8')
          anchor = '''.admin-shell main .max-w-7xl {
            width: 100% !important;
            max-width: none !important;
          }
          '''
          replacement = '''.admin-shell main .max-w-7xl {
            width: 100% !important;
            max-width: none !important;
          }

          /* Admin pages must not inherit centered desktop width caps from individual screens. */
          .admin-shell > div:first-child {
            width: 100% !important;
            max-width: none !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
          }

          .admin-shell main > div > div[class*="max-w-"],
          .admin-shell main > section > div[class*="max-w-"] {
            width: 100% !important;
            max-width: none !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
          }
          '''
          if anchor not in css_text:
              raise SystemExit('Admin CSS anchor was not found')
          css.write_text(css_text.replace(anchor, replacement, 1), encoding='utf-8')

      - name: Validate client
        continue-on-error: true
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "Viktor Iliev"
          git config user.email "96659685+viktor132607@users.noreply.github.com"
          git rm .github/workflows/one-shot-admin-full-width.yml
          git add src/pages/admin/AdminPanel.tsx src/responsive-audit.css
          git commit -m "[skip admin-full-width] Use full viewport width across admin panel"
          git push
