name: One-shot product save feedback fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-product-save-feedback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch product editor
        run: python scripts/patch-product-save-feedback.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-product-save-feedback.yml
          git rm scripts/patch-product-save-feedback.py
          git add src/components/admin/AdminProductsLegacy.tsx
          git commit -m "Fix product edit errors and stale categories"
          git push
