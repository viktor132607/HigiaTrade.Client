name: One-shot product image fallback and preview fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-product-image-previews.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip product-image-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Product image is optional in the admin form. The save interceptor below
          # supplies the selected brand image, or the site logo as a final fallback.
          replace_once(
              'src/components/admin/AdminProductsLegacy.tsx',
              '''    if (!formData.mainImageUrl.trim()) {\n      errors.mainImageUrl = "Качи поне една снимка и избери основна.";\n    }\n\n''',
              '',
              'remove required product image validation',
          )

          brand_path = Path('src/components/admin/ProductBrandEnhancer.tsx')
          brand = brand_path.read_text(encoding='utf-8')

          old = '''type BrandOption = {\n  id?: string;\n  name: string;\n  productCount: number;\n};'''
          new = '''type BrandOption = {\n  id?: string;\n  name: string;\n  thumbnailImageUrl?: string | null;\n  productCount: number;\n};'''
          if brand.count(old) != 1:
              raise SystemExit('BrandOption shape not found exactly once')
          brand = brand.replace(old, new, 1)

          old = '''  const targetRef = useRef<Target | null>(null);\n  const brandRef = useRef("");'''
          new = '''  const targetRef = useRef<Target | null>(null);\n  const brandRef = useRef("");\n  const brandsRef = useRef<BrandOption[]>([]);'''
          if brand.count(old) != 1:
              raise SystemExit('brand refs block not found exactly once')
          brand = brand.replace(old, new, 1)

          old = '''      const data = await response.json();\n      setBrands(Array.isArray(data) ? data : []);'''
          new = '''      const data = await response.json();\n      const normalizedBrands: BrandOption[] = Array.isArray(data) ? data : [];\n      brandsRef.current = normalizedBrands;\n      setBrands(normalizedBrands);'''
          if brand.count(old) != 1:
              raise SystemExit('loadBrands assignment not found exactly once')
          brand = brand.replace(old, new, 1)

          old = '''      const created: BrandOption = {\n        id: data?.id ? String(data.id) : undefined,\n        name: String(data?.name || name),\n        productCount: Number(data?.productCount || 0),\n      };\n      setBrands((current) => [...current.filter((item) => item.name.toLocaleLowerCase("bg-BG") !== created.name.toLocaleLowerCase("bg-BG")), created].sort((a, b) => a.name.localeCompare(b.name, "bg-BG")));'''
          new = '''      const created: BrandOption = {\n        id: data?.id ? String(data.id) : undefined,\n        name: String(data?.name || name),\n        thumbnailImageUrl: data?.thumbnailImageUrl ? String(data.thumbnailImageUrl) : null,\n        productCount: Number(data?.productCount || 0),\n      };\n      setBrands((current) => {\n        const next = [...current.filter((item) => item.name.toLocaleLowerCase("bg-BG") !== created.name.toLocaleLowerCase("bg-BG")), created].sort((a, b) => a.name.localeCompare(b.name, "bg-BG"));\n        brandsRef.current = next;\n        return next;\n      });'''
          if brand.count(old) != 1:
              raise SystemExit('created brand block not found exactly once')
          brand = brand.replace(old, new, 1)

          old = '''        const payload = JSON.parse(init.body);\n        payload.brand = brandRef.current.trim() || null;\n        return originalFetch(input, { ...init, body: JSON.stringify(payload) });'''
          new = '''        const payload = JSON.parse(init.body);\n        const selectedBrand = brandRef.current.trim();\n        payload.brand = selectedBrand || null;\n\n        if (!String(payload.mainImageUrl ?? "").trim()) {\n          const selectedBrandData = brandsRef.current.find(\n            (item) => item.name.trim().toLocaleLowerCase("bg-BG") === selectedBrand.toLocaleLowerCase("bg-BG")\n          );\n          payload.mainImageUrl = selectedBrandData?.thumbnailImageUrl?.trim() || "/higiqlogo.png";\n        }\n\n        return originalFetch(input, { ...init, body: JSON.stringify(payload) });'''
          if brand.count(old) != 1:
              raise SystemExit('product save interceptor block not found exactly once')
          brand = brand.replace(old, new, 1)
          brand_path.write_text(brand, encoding='utf-8')

          pricing_path = Path('src/components/admin/ProductPricingAndUploadFields.tsx')
          pricing = pricing_path.read_text(encoding='utf-8')

          old = '''  const notifyImagesChange = (\n    images: ProductImage[],\n    preferredMainImageUri = mainImageUri\n  ) => {\n    const cleanImages = images.filter((image) => image.uri?.trim());\n    const resolvedMainImageUri = cleanImages.some(\n      (image) => image.uri === preferredMainImageUri\n    )\n      ? preferredMainImageUri\n      : cleanImages[0]?.uri ?? "";\n\n    setUploadedImages(cleanImages);\n    setMainImageUri(resolvedMainImageUri);\n    onImagesChange(\n      resolvedMainImageUri,\n      cleanImages.filter((image) => image.uri !== resolvedMainImageUri)\n    );\n  };'''
          new = '''  const notifyImagesChange = (\n    images: ProductImage[],\n    preferredMainImageUri = mainImageUri\n  ) => {\n    const cleanImages = images.filter((image) => image.uri?.trim());\n    const resolvedMainImageUri = cleanImages.some(\n      (image) => image.uri === preferredMainImageUri\n    )\n      ? preferredMainImageUri\n      : cleanImages[0]?.uri ?? "";\n    const mainImage = cleanImages.find((image) => image.uri === resolvedMainImageUri);\n    const orderedImages = mainImage\n      ? [mainImage, ...cleanImages.filter((image) => image.uri !== resolvedMainImageUri)]\n      : cleanImages;\n\n    setUploadedImages(orderedImages);\n    setMainImageUri(resolvedMainImageUri);\n    onImagesChange(\n      resolvedMainImageUri,\n      orderedImages.filter((image) => image.uri !== resolvedMainImageUri)\n    );\n  };'''
          if pricing.count(old) != 1:
              raise SystemExit('notifyImagesChange block not found exactly once')
          pricing = pricing.replace(old, new, 1)

          old = '''  const setMainImage = (image: ProductImage) => {\n    setMainImageUri(image.uri);\n    onImagesChange(\n      image.uri,\n      uploadedImages.filter((item) => item.uri !== image.uri)\n    );\n  };'''
          new = '''  const setMainImage = (image: ProductImage) => {\n    notifyImagesChange(uploadedImages, image.uri);\n  };'''
          if pricing.count(old) != 1:
              raise SystemExit('setMainImage block not found exactly once')
          pricing = pricing.replace(old, new, 1)

          old = '            <div className="grid grid-cols-2 gap-2 sm:grid-cols-3 sm:gap-3 lg:grid-cols-4">'
          new = '            <div className="grid grid-cols-2 items-stretch gap-2 sm:grid-cols-3 sm:gap-3 lg:grid-cols-4 xl:grid-cols-5">'
          if pricing.count(old) != 1:
              raise SystemExit('preview grid class not found exactly once')
          pricing = pricing.replace(old, new, 1)

          old = '''                    <img src={image.uri} alt={`Снимка ${index + 1}`} draggable={false} className="aspect-square w-full select-none object-cover sm:h-32 sm:aspect-auto" />'''
          new = '''                    <div className="aspect-square w-full overflow-hidden bg-slate-50">\n                      <img src={image.uri} alt={`Снимка ${index + 1}`} draggable={false} className="h-full w-full select-none object-contain" />\n                    </div>'''
          if pricing.count(old) != 1:
              raise SystemExit('preview image element not found exactly once')
          pricing = pricing.replace(old, new, 1)

          pricing_path.write_text(pricing, encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Viktor Iliev"
          git config user.email "96659685+viktor132607@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-product-image-previews.yml
          git add src/components/admin/AdminProductsLegacy.tsx src/components/admin/ProductBrandEnhancer.tsx src/components/admin/ProductPricingAndUploadFields.tsx
          git commit -m "[skip product-image-fix] Fix product image fallback and preview ordering"
          git push
