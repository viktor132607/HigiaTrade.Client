name: Deploy Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Verify static export and SEO generator
        run: |
          test -s out/index.html
          test -d out/_next
          test -s out/sitemap.xml
          test -s out/image-sitemap.xml
          test -s out/google-merchant.xml
          test -s out/google-merchant.csv
          test -s out/llms.txt
          test -s out/seo-manifest.json
          test -s out/sano/index.html
          test -s out/sano/ruse/index.html
          test -s out/sano/silistra/index.html
          test -s out/sano/razgrad/index.html
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("out/seo-manifest.json","utf8")); if(m.regionalPages!==6) process.exit(1); if(!Array.isArray(m.feeds)||m.feeds.length<5) process.exit(1); console.log(m)'
