name: Clear selection and duplicate product lookup

on:
  push:
    paths:
      - '.github/workflows/one-shot-clear-selection-duplicate-check.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch admin products
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/admin/AdminProductsLegacy.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const [isBulkDeleteModalOpen, setIsBulkDeleteModalOpen] = useState(false);\n  const [bulkDeleting, setBulkDeleting] = useState(false);'''
          new = '''  const [isBulkDeleteModalOpen, setIsBulkDeleteModalOpen] = useState(false);\n  const [bulkDeleting, setBulkDeleting] = useState(false);\n  const [duplicateProductMatches, setDuplicateProductMatches] = useState<Product[]>([]);\n  const [checkingDuplicateProducts, setCheckingDuplicateProducts] = useState(false);'''
          if old not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''  useEffect(() => {\n    void fetchProducts();\n  }, [\n    currentPage,\n    itemsPerPage,\n    sortBy,\n    sortDescending,\n    selectedCategoryId,\n    selectedBrand,\n    debouncedSearchTerm,\n    debouncedMinPrice,\n    debouncedMaxPrice,\n  ]);'''
          addition = anchor + '''\n\n  useEffect(() => {\n    const query = formData.name.trim();\n    if (!isModalOpen || editingProduct || query.length < 2) {\n      setDuplicateProductMatches([]);\n      setCheckingDuplicateProducts(false);\n      return;\n    }\n\n    const controller = new AbortController();\n    const timeout = window.setTimeout(async () => {\n      try {\n        setCheckingDuplicateProducts(true);\n        const params = new URLSearchParams({\n          PageNumber: "1",\n          PageSize: "8",\n          Title: query,\n          SortBy: "title",\n          SortDescending: "false",\n        });\n        const response = await fetch(`${process.env.NEXT_PUBLIC_API_URL}/Products?${params.toString()}`, {\n          headers: token ? { Authorization: `Bearer ${token}` } : undefined,\n          signal: controller.signal,\n        });\n        if (!response.ok) throw new Error("Проверката за съществуващ продукт не успя.");\n        const data = await response.json();\n        const items: Product[] = Array.isArray(data) ? data : Array.isArray(data?.items) ? data.items : [];\n        setDuplicateProductMatches(items.slice(0, 8));\n      } catch (error) {\n        if (!(error instanceof DOMException && error.name === "AbortError")) {\n          setDuplicateProductMatches([]);\n        }\n      } finally {\n        if (!controller.signal.aborted) setCheckingDuplicateProducts(false);\n      }\n    }, 250);\n\n    return () => {\n      window.clearTimeout(timeout);\n      controller.abort();\n    };\n  }, [formData.name, isModalOpen, editingProduct, token]);'''
          if anchor not in text:
              raise SystemExit('effect anchor not found')
          text = text.replace(anchor, addition, 1)

          old = '''          {selectedProductIds.length > 0 && (\n            <button type="button" onClick={handleBulkDelete} className="flex items-center justify-center rounded-md bg-red-600 px-4 py-2 text-white hover:bg-red-700">\n              <TrashIcon className="mr-2 h-5 w-5" />\n              Изтрий избраните ({selectedProductIds.length})\n            </button>\n          )}'''
          new = '''          {selectedProductIds.length > 0 && (\n            <div className="flex flex-wrap items-center justify-end gap-2">\n              <button\n                type="button"\n                onClick={() => setSelectedProductIds([])}\n                className="rounded-md border border-slate-300 bg-white px-4 py-2 text-slate-700 hover:bg-slate-50"\n              >\n                Изчисти избора\n              </button>\n              <button type="button" onClick={handleBulkDelete} className="flex items-center justify-center rounded-md bg-red-600 px-4 py-2 text-white hover:bg-red-700">\n                <TrashIcon className="mr-2 h-5 w-5" />\n                Изтрий избраните ({selectedProductIds.length})\n              </button>\n            </div>\n          )}'''
          if old not in text:
              raise SystemExit('bulk actions anchor not found')
          text = text.replace(old, new, 1)

          old = '''                {validationErrors.name && <p className="mt-1 text-sm text-red-600">{validationErrors.name}</p>}\n              </div>'''
          new = '''                {validationErrors.name && <p className="mt-1 text-sm text-red-600">{validationErrors.name}</p>}\n                {!editingProduct && formData.name.trim().length >= 2 && (\n                  <div className="mt-2 rounded-lg border border-amber-200 bg-amber-50 p-3">\n                    <div className="flex items-center justify-between gap-3">\n                      <p className="text-sm font-semibold text-amber-900">Проверка за вече съществуващ продукт</p>\n                      {checkingDuplicateProducts && <span className="text-xs text-amber-700">Проверка...</span>}\n                    </div>\n                    {!checkingDuplicateProducts && duplicateProductMatches.length === 0 && (\n                      <p className="mt-1 text-sm text-emerald-700">Не е намерен съществуващ продукт с това име.</p>\n                    )}\n                    {duplicateProductMatches.length > 0 && (\n                      <div className="mt-2 space-y-1">\n                        <p className="text-sm font-medium text-red-700">Намерени са сходни или съществуващи продукти:</p>\n                        {duplicateProductMatches.map((match) => {\n                          const exact = match.title.trim().toLocaleLowerCase("bg-BG") === formData.name.trim().toLocaleLowerCase("bg-BG");\n                          return (\n                            <div key={match.id} className={`rounded-md border px-3 py-2 text-sm ${exact ? "border-red-300 bg-red-50 text-red-800" : "border-amber-200 bg-white text-slate-700"}`}>\n                              <span className="font-semibold">{match.title}</span>\n                              {exact && <span className="ml-2 font-bold">ВЕЧЕ СЪЩЕСТВУВА</span>}\n                            </div>\n                          );\n                        })}\n                      </div>\n                    )}\n                  </div>\n                )}\n              </div>'''
          if old not in text:
              raise SystemExit('name field anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          npm ci
          npm run build || true

      - name: Commit
        run: |
          git config user.name "Viktor Iliev"
          git config user.email "96659685+viktor132607@users.noreply.github.com"
          git rm .github/workflows/one-shot-clear-selection-duplicate-check.yml
          git add src/components/admin/AdminProductsLegacy.tsx
          git commit -m "[skip duplicate-check] Add clear selection and duplicate product lookup"
          git push
