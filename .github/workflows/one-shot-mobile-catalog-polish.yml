name: One-shot mobile catalog polish

on:
  push:
    paths:
      - '.github/workflows/one-shot-mobile-catalog-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Polish mobile catalog and product cards
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new, label in replacements:
                  if old not in text:
                      raise SystemExit(f'{path}: missing anchor {label}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          patch('src/pages/Products.tsx', [
              (
                  'className="mb-5 flex flex-col gap-3 rounded-lg border border-slate-200 bg-white px-4 py-4 shadow-sm sm:mb-7 sm:flex-row sm:items-center sm:justify-between"',
                  'className="mb-4 flex flex-col gap-3 rounded-xl border border-slate-200 bg-white px-3 py-3 shadow-sm sm:mb-7 sm:flex-row sm:items-center sm:justify-between sm:px-4 sm:py-4"',
                  'toolbar shell'
              ),
              (
                  'className="flex flex-wrap items-center gap-3"',
                  'className="grid w-full grid-cols-1 gap-2 min-[430px]:grid-cols-2 sm:flex sm:w-auto sm:flex-wrap sm:items-center sm:gap-3"',
                  'toolbar controls'
              ),
              (
                  'className="flex items-center gap-2 text-sm text-slate-800"',
                  'className="flex min-w-0 flex-col gap-1 text-sm text-slate-800 sm:flex-row sm:items-center sm:gap-2"',
                  'sort label'
              ),
              (
                  'className="min-h-10 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-[#18b99f]"',
                  'className="min-h-10 w-full min-w-0 rounded-md border border-slate-300 bg-white px-2.5 py-2 text-sm text-slate-700 outline-none focus:border-[#18b99f] sm:w-auto sm:px-3"',
                  'sort select'
              ),
              (
                  'className="flex items-center gap-2 text-sm text-slate-800"',
                  'className="flex min-w-0 flex-col gap-1 text-sm text-slate-800 sm:flex-row sm:items-center sm:gap-2"',
                  'page size label'
              ),
              (
                  'className="min-h-10 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-[#18b99f]"',
                  'className="min-h-10 w-full min-w-0 rounded-md border border-slate-300 bg-white px-2.5 py-2 text-sm text-slate-700 outline-none focus:border-[#18b99f] sm:w-auto sm:px-3"',
                  'page size select'
              ),
              (
                  'className="flex items-center gap-2 text-sm text-slate-800"',
                  'className="flex w-full items-center justify-between gap-2 text-sm text-slate-800 sm:w-auto sm:justify-start"',
                  'view controls'
              ),
              (
                  'className="flex flex-col gap-5 sm:gap-8 xl:flex-row"',
                  'className="flex flex-col gap-4 sm:gap-8 xl:flex-row"',
                  'catalog layout gap'
              ),
              (
                  'className="grid grid-cols-1 gap-4 min-[480px]:grid-cols-2 sm:gap-6 lg:grid-cols-3 2xl:grid-cols-4 min-[2200px]:grid-cols-5"',
                  'className="grid grid-cols-2 gap-2.5 min-[430px]:gap-3 sm:gap-6 lg:grid-cols-3 2xl:grid-cols-4 min-[2200px]:grid-cols-5"',
                  'mobile product grid'
              ),
          ])

          patch('src/components/products/FilterSidebar.tsx', [
              (
                  'import { MagnifyingGlassIcon, XMarkIcon } from "@heroicons/react/24/outline";',
                  'import { AdjustmentsHorizontalIcon, ChevronDownIcon, MagnifyingGlassIcon, XMarkIcon } from "@heroicons/react/24/outline";',
                  'filter icons'
              ),
              (
                  'const didRunAutoApply = useRef(false);',
                  'const didRunAutoApply = useRef(false);\n  const [mobileOpen, setMobileOpen] = useState(false);',
                  'mobile filter state'
              ),
              (
                  'const handleCategoryChange = (categoryId: string | null) => onApplyFilters({ category: categoryId });',
                  'const handleCategoryChange = (categoryId: string | null) => { onApplyFilters({ category: categoryId }); setMobileOpen(false); };',
                  'category close'
              ),
              (
                  '<aside className="w-full xl:w-72 xl:shrink-0 xl:self-start">\n      <div className="box-border h-auto max-h-none w-full overflow-visible rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_-55px_rgba(15,23,42,0.55)] sm:p-6">',
                  '<aside className="w-full xl:w-72 xl:shrink-0 xl:self-start">\n      <button type="button" onClick={() => setMobileOpen((open) => !open)} className="flex h-12 w-full items-center justify-between rounded-xl border border-slate-200 bg-white px-4 text-sm font-bold text-slate-800 shadow-sm xl:hidden"><span className="flex items-center gap-2"><AdjustmentsHorizontalIcon className="h-5 w-5 text-[#18b99f]" />{isBg ? "Филтри" : "Filters"}</span><ChevronDownIcon className={`h-5 w-5 transition ${mobileOpen ? "rotate-180" : ""}`} /></button>\n      <div className={`${mobileOpen ? "mt-3 block" : "hidden"} box-border h-auto max-h-none w-full overflow-visible rounded-2xl border border-slate-200 bg-white p-4 shadow-[0_24px_70px_-55px_rgba(15,23,42,0.55)] sm:p-6 xl:mt-0 xl:block xl:rounded-[2rem]`}>',
                  'mobile filter toggle'
              ),
          ])

          patch('src/components/products/ProductActions.tsx', [
              (
                  ': "flex h-11 w-full min-w-0 items-center justify-center gap-2 whitespace-nowrap break-normal rounded-lg border px-3 text-sm font-semibold transition";',
                  ': "flex h-10 w-full min-w-0 items-center justify-center gap-1.5 whitespace-nowrap break-normal rounded-lg border px-2 text-xs font-semibold transition sm:h-11 sm:gap-2 sm:px-3 sm:text-sm";',
                  'responsive action buttons'
              ),
              (
                  'className={compact ? "flex flex-wrap items-center gap-2" : "mt-3 grid grid-cols-2 gap-2.5"}',
                  'className={compact ? "flex flex-wrap items-center gap-2" : "mt-2 grid grid-cols-2 gap-2 sm:mt-3 sm:gap-2.5"}',
                  'responsive action grid'
              ),
              (
                  '<span className="whitespace-nowrap break-normal">{isBg ? (isCompared ? "Добавен" : "Сравни") : isCompared ? "Added" : "Compare"}</span>',
                  '<span className="hidden whitespace-nowrap break-normal sm:inline">{isBg ? (isCompared ? "Добавен" : "Сравни") : isCompared ? "Added" : "Compare"}</span>',
                  'compare mobile label'
              ),
              (
                  '<span className="whitespace-nowrap break-normal">{isBg ? "Любими" : "Wishlist"}</span>',
                  '<span className="hidden whitespace-nowrap break-normal sm:inline">{isBg ? "Любими" : "Wishlist"}</span>',
                  'wishlist mobile label'
              ),
          ])

          patch('src/components/products/ProductCard.tsx', [
              (
                  'className="group flex h-full cursor-pointer flex-col overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_28px_90px_-60px_rgba(15,23,42,0.55)] transition duration-300 hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-[#18b99f]"',
                  'className="group flex h-full cursor-pointer flex-col overflow-hidden rounded-[1.15rem] border border-slate-200 bg-white shadow-[0_20px_60px_-50px_rgba(15,23,42,0.45)] transition duration-300 hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-[#18b99f] sm:rounded-[2rem] sm:shadow-[0_28px_90px_-60px_rgba(15,23,42,0.55)]"',
                  'card shell'
              ),
              (
                  'className="h-60 w-full object-cover transition duration-500 group-hover:scale-105 sm:h-64"',
                  'className="h-40 w-full object-cover transition duration-500 group-hover:scale-105 min-[430px]:h-44 sm:h-64"',
                  'mobile image height'
              ),
              (
                  'className="absolute left-4 top-4 flex flex-col items-start gap-2"',
                  'className="absolute left-2 top-2 flex flex-col items-start gap-1.5 sm:left-4 sm:top-4 sm:gap-2"',
                  'mobile badges position'
              ),
              (
                  'className="rounded-full bg-[#18b99f] px-3 py-1 text-xs font-bold uppercase text-white"',
                  'className="rounded-full bg-[#18b99f] px-2 py-0.5 text-[10px] font-bold uppercase text-white sm:px-3 sm:py-1 sm:text-xs"',
                  'new badge'
              ),
              (
                  'className="rounded-full bg-rose-600 px-3 py-1 text-xs font-bold text-white"',
                  'className="rounded-full bg-rose-600 px-2 py-0.5 text-[10px] font-bold text-white sm:px-3 sm:py-1 sm:text-xs"',
                  'discount badge'
              ),
              (
                  '<span className={`absolute right-4 top-4 rounded-full px-3 py-1 text-xs font-semibold ${product.quantity===0?"bg-rose-100 text-rose-700":"bg-emerald-100 text-emerald-700"}`}>{stockLabel}</span>',
                  '<span className={`absolute right-2 top-2 rounded-full px-2 py-0.5 text-[10px] font-semibold sm:right-4 sm:top-4 sm:px-3 sm:py-1 sm:text-xs ${product.quantity===0?"bg-rose-100 text-rose-700":"bg-emerald-100 text-emerald-700"}`}><span className="sm:hidden">{product.quantity===0?(isBg?"Няма":"Out"):(isBg?"Налично":"Stock")}</span><span className="hidden sm:inline">{stockLabel}</span></span>',
                  'stock badge'
              ),
              (
                  '<div className="flex flex-1 flex-col p-5">',
                  '<div className="flex flex-1 flex-col p-3 sm:p-5">',
                  'card padding'
              ),
              (
                  '<div className="flex items-center justify-between gap-3"><p className="text-xs font-semibold uppercase tracking-[0.24em] text-slate-400">',
                  '<div className="flex items-center justify-between gap-2"><p className="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-400 sm:text-xs sm:tracking-[0.24em]">',
                  'product meta'
              ),
              (
                  'className="flex items-center gap-1 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700"',
                  'className="flex items-center gap-1 rounded-full bg-amber-50 px-2 py-0.5 text-[10px] font-semibold text-amber-700 sm:px-2.5 sm:py-1 sm:text-xs"',
                  'rating pill'
              ),
              (
                  'className="mt-4 min-h-[3.25rem] line-clamp-2 font-display text-xl font-semibold leading-tight text-slate-950 hover:text-[#18b99f]"',
                  'className="mt-2 min-h-[2.5rem] line-clamp-2 font-display text-sm font-semibold leading-5 text-slate-950 hover:text-[#18b99f] sm:mt-4 sm:min-h-[3.25rem] sm:text-xl sm:leading-tight"',
                  'mobile title'
              ),
              (
                  'className="mt-3 min-h-[4.5rem] line-clamp-3 text-sm leading-6 text-slate-600"',
                  'className="mt-3 hidden min-h-[4.5rem] line-clamp-3 text-sm leading-6 text-slate-600 sm:block"',
                  'mobile description'
              ),
              (
                  '<div className="mt-auto pt-6">',
                  '<div className="mt-auto pt-4 sm:pt-6">',
                  'mobile price spacing'
              ),
              (
                  '<div className="flex min-h-[4.75rem] items-end justify-between gap-4">',
                  '<div className="flex min-h-[4.25rem] items-end justify-between gap-2 sm:min-h-[4.75rem] sm:gap-4">',
                  'price zone'
              ),
              (
                  '<div className="flex min-h-[4.75rem] flex-col justify-end">',
                  '<div className="flex min-h-[4.25rem] min-w-0 flex-col justify-end sm:min-h-[4.75rem]">',
                  'price column'
              ),
              (
                  'className={`font-display text-2xl font-bold ${promoActive?"text-rose-600":"text-slate-950"}`}',
                  'className={`font-display text-lg font-bold sm:text-2xl ${promoActive?"text-rose-600":"text-slate-950"}`}',
                  'mobile price font'
              ),
              (
                  'className={`mb-1 shrink-0 text-right text-xs ${product.quantity===0?"font-semibold text-rose-600":"text-emerald-600"}`}',
                  'className={`mb-1 hidden shrink-0 text-right text-xs sm:block ${product.quantity===0?"font-semibold text-rose-600":"text-emerald-600"}`}',
                  'mobile duplicate stock label'
              ),
              (
                  'className={`mt-3 inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl px-4 py-3 text-sm font-semibold ${product.quantity===0?"cursor-not-allowed bg-slate-100 text-slate-400":"bg-slate-950 text-white hover:bg-primary-600"}`}',
                  'className={`mt-2 inline-flex min-h-10 w-full items-center justify-center gap-1.5 rounded-xl px-2 py-2 text-xs font-semibold sm:mt-3 sm:min-h-12 sm:gap-2 sm:rounded-2xl sm:px-4 sm:py-3 sm:text-sm ${product.quantity===0?"cursor-not-allowed bg-slate-100 text-slate-400":"bg-slate-950 text-white hover:bg-primary-600"}`}',
                  'mobile cart button'
              ),
              (
                  '<ShoppingBagIcon className="h-5 w-5"/>{product.quantity===0?(isBg?"Изчерпан продукт":"Unavailable"):(isBg?"Добави в количката":"Add to cart")}',
                  '<ShoppingBagIcon className="h-4 w-4 sm:h-5 sm:w-5"/><span className="sm:hidden">{product.quantity===0?(isBg?"Няма":"Out"):(isBg?"Купи":"Buy")}</span><span className="hidden sm:inline">{product.quantity===0?(isBg?"Изчерпан продукт":"Unavailable"):(isBg?"Добави в количката":"Add to cart")}</span>',
                  'mobile cart label'
              ),
          ])

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Commit source changes
        run: |
          git checkout -- package-lock.json package.json 2>/dev/null || true
          git config user.name "Viktor Iliev"
          git config user.email "96659685+viktor132607@users.noreply.github.com"
          git add src/pages/Products.tsx src/components/products/FilterSidebar.tsx src/components/products/ProductActions.tsx src/components/products/ProductCard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Polish catalog mobile layout"
          git push
