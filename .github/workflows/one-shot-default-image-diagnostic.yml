name: Default image diagnostic

"on":
  push:
    paths:
      - '.github/workflows/one-shot-default-image-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production product and brand image URLs
        shell: bash
        run: |
          set -euo pipefail
          API='https://higiatrade-server.onrender.com/api'
          echo '=== PRODUCTS ==='
          curl -fsSL "$API/Products?PageNumber=1&PageSize=30&SortBy=title&SortDescending=false" \
            | jq -r '.items[] | [.title, (.brand // ""), (.mainImageUrl // ""), ((.usesDefaultImage // false)|tostring)] | @tsv'
          echo '=== BRANDS ==='
          curl -fsSL "$API/Brands" \
            | jq -r '.[] | [.name, (.thumbnailImageUrl // "")] | @tsv'
          echo '=== IMAGE PAYLOAD ==='
          url=$(curl -fsSL "$API/Brands" | jq -r '.[0].thumbnailImageUrl')
          curl -sSL -D /tmp/headers.txt "$url" -o /tmp/default-image.bin
          cat /tmp/headers.txt
          echo "size=$(wc -c < /tmp/default-image.bin)"
          file /tmp/default-image.bin
          xxd -l 32 /tmp/default-image.bin
